name: Build VoidLink IPA
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-voidlink-ipa.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: The-Fried-Fish/VoidLink-previously-moonlight-zwm
          ref: Integration
          submodules: recursive
          persist-credentials: false
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build for iPad and iPhone
        shell: bash
        run: |
          git rev-parse HEAD
          xcodebuild -version
          xcodebuild -project VoidLink.xcodeproj -scheme VoidLink \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/voidlink-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=1 build 2>&1 | tee "$RUNNER_TEMP/voidlink-build.log"
      - name: Package unsigned IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/voidlink-build/Build/Products/Release-iphoneos/VoidLink.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/VoidLink.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload VoidLink-unsigned.ipa
          unzip -tq VoidLink-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned-IPA
          path: ${{ runner.temp }}/ipa/VoidLink-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: VoidLink-build-log
          path: ${{ runner.temp }}/voidlink-build.log
